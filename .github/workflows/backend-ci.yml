name: Backend CI

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django-checks:
    name: Django Checks and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: retail_shop_backend

    steps:
      - name: Check backend repository access
        id: backend-access
        env:
          GH_TOKEN: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          BACKEND_REPO: Segun-Retail/retail_shop_backend
        run: |
          if gh api "repos/${BACKEND_REPO}" >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Backend repository accessible."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend repository ${BACKEND_REPO} is not accessible with current token. Set BACKEND_REPO_TOKEN secret (repo read access) or make the repo accessible. Skipping backend checks."
          fi

      - name: Checkout frontend repository
        if: steps.backend-access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          path: retail_shop_frontend

      - name: Checkout backend repository
        if: steps.backend-access.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Segun-Retail/retail_shop_backend
          path: retail_shop_backend
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}

      - name: Set up Python
        if: steps.backend-access.outputs.available == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.backend-access.outputs.available == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install backend dependencies
        if: steps.backend-access.outputs.available == 'true'
        run: uv sync --frozen

      - name: Django system checks
        if: steps.backend-access.outputs.available == 'true'
        env:
          DJANGO_SECRET_KEY: ci-insecure-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: uv run python manage.py check

      - name: Check for uncommitted migrations
        if: steps.backend-access.outputs.available == 'true'
        env:
          DJANGO_SECRET_KEY: ci-insecure-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run backend tests
        if: steps.backend-access.outputs.available == 'true'
        env:
          DJANGO_SECRET_KEY: ci-insecure-secret-key
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: uv run python manage.py test

      - name: Backend checks skipped
        if: steps.backend-access.outputs.available != 'true'
        run: |
          echo "Backend CI skipped: Segun-Retail/retail_shop_backend not accessible."
          echo "Configure BACKEND_REPO_TOKEN secret or ensure repository access, then re-run."
